name: Rename main file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename andy-personal-site.html to index.html
        run: |
          git config user.name "adiazjmj-cpu"
          git config user.email "adiazjmj-cpu@users.noreply.github.com"
          git mv andy-personal-site.html index.html
          git commit -m "Rename andy-personal-site.html to index.html"
          git push
